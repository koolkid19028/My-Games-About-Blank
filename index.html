<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
</head>
<body>
<script>
(async () => {
    const blank = window.open("about:blank", "_blank");
    if (!blank) {
        document.body.innerHTML =
            "<h2>Popup blocked</h2><p>Please allow popups and try again.</p>";
        return;
    }
    try {
        const response = await fetch("main.html");
        if (!response.ok) {
            throw new Error("Could not load main.html");
        }
        let html = await response.text();
        /*
         * Keep relative CSS, JS, images, etc. pointing to
         * the same folder as main.html.
         */
        const base = new URL("main.html", location.href).href;
        if (/<head[\s>]/i.test(html)) {
            html = html.replace(
                /<head([^>]*)>/i,
                `<head$1><base href="${base}">`
            );
        } else {
            html = `<base href="${base}">` + html;
        }
        blank.document.open();
        blank.document.write(html);
        blank.document.close();
        // Keep the original page out of the way.
        window.location.replace("about:blank");
    } catch (error) {
        blank.document.open();
        blank.document.write(`
            <!DOCTYPE html>
            <html>
            <body>
                <h2>Failed to load main.html</h2>
                <p>${error.message}</p>
            </body>
            </html>
        `);
        blank.document.close();
    }
})();
</script>
</body>
</html>
