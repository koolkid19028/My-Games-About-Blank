```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
</head>
<body>

<script>
(async function () {
    const targetURL =
        "https://google-classroom-liard.vercel.app/Duckmath/index.html";

    // Open a genuine about:blank tab
    const blank = window.open("about:blank", "_blank");

    if (!blank) {
        document.body.innerHTML =
            "<h2>Popup blocked</h2><p>Please allow popups for this site.</p>";
        return;
    }

    try {
        // Request the Duckmath page
        const response = await fetch(targetURL);

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        let html = await response.text();

        /*
         * Make relative files such as:
         *
         *   style.css
         *   script.js
         *   games/foo.html
         *   images/logo.png
         *
         * resolve relative to /Duckmath/
         */
        const baseTag =
            '<base href="https://google-classroom-liard.vercel.app/Duckmath/">';

        if (/<head[\s>]/i.test(html)) {
            html = html.replace(
                /<head([^>]*)>/i,
                `<head$1>${baseTag}`
            );
        } else {
            html = baseTag + html;
        }

        // Write the page directly into about:blank.
        // No iframe is used.
        blank.document.open();
        blank.document.write(html);
        blank.document.close();

    } catch (error) {
        blank.document.open();
        blank.document.write(`
            <!DOCTYPE html>
            <html>
            <body style="font-family:Arial;text-align:center;padding:40px">
                <h2>Could not load Duckmath</h2>
                <p>${error.message}</p>
            </body>
            </html>
        `);
        blank.document.close();
    }
})();
</script>

</body>
</html>
```
