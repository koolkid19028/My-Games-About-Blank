```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
</head>

<body>
<script>
(async function () {

    // Open a real about:blank tab
    const blank = window.open("about:blank", "_blank");

    if (!blank) {
        document.body.innerHTML =
            "<h2>Popup blocked</h2><p>Please allow popups for this site.</p>";
        return;
    }

    try {
        // Get main.html from the SAME directory as this index.html
        const mainURL = new URL("main.html", window.location.href);

        const response = await fetch(mainURL);

        if (!response.ok) {
            throw new Error("Could not load main.html (" + response.status + ")");
        }

        let html = await response.text();

        /*
         * IMPORTANT:
         * Make relative links resolve from the actual directory
         * containing main.html.
         */
        const baseURL = new URL("./", mainURL).href;

        const baseTag = `<base href="${baseURL}">`;

        if (/<head[\s>]/i.test(html)) {
            html = html.replace(
                /<head([^>]*)>/i,
                `<head$1>${baseTag}`
            );
        } else {
            html = baseTag + html;
        }

        // Put main.html directly into about:blank.
        // No iframe is used.
        blank.document.open();
        blank.document.write(html);
        blank.document.close();

    } catch (error) {

        blank.document.open();
        blank.document.write(`
            <!DOCTYPE html>
            <html>
            <body style="font-family:Arial;text-align:center;padding:50px">
                <h2>Failed to load main.html</h2>
                <p>${error.message}</p>
            </body>
            </html>
        `);
        blank.document.close();
    }

})();
</script>
</body>
</html>
```
