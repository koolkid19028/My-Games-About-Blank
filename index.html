<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
</head>
<body>
<script>
(async function () {
    const blank = window.open("about:blank", "_blank");
    if (!blank) {
        document.body.textContent = "Popup blocked.";
        return;
    }
    try {
        const response = await fetch("./main.html");
        if (!response.ok) {
            throw new Error("main.html could not be loaded");
        }
        let html = await response.text();
        // Make relative CSS/JS/image paths work like they do in main.html.
        const baseURL = new URL("./", window.location.href).href;
        if (/<head[\s>]/i.test(html)) {
            html = html.replace(
                /<head([^>]*)>/i,
                `<head$1><base href="${baseURL}">`
            );
        } else {
            html = `<base href="${baseURL}">` + html;
        }
        // main.html becomes the actual document.
        // No iframe is used.
        blank.document.open();
        blank.document.write(html);
        blank.document.close();
    } catch (err) {
        blank.document.open();
        blank.document.write(`
            <!DOCTYPE html>
            <html>
            <body>
                <h2>Could not load the site</h2>
                <p>${err.message}</p>
            </body>
            </html>
        `);
        blank.document.close();
    }
})();
</script>
</body>
</html>
