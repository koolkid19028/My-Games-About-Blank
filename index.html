<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
</head>
<body>
<script>
const blank = window.open("about:blank", "_blank");
if (blank) {
    blank.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
            <title>Loading</title>
            <style>
                html, body {
                    margin: 0;
                    padding: 0;
                    width: 100%;
                    height: 100%;
                    overflow: hidden;
                }
                iframe {
                    width: 100%;
                    height: 100%;
                    border: 0;
                }
            </style>
        </head>
        <body>
            <iframe src="${location.origin}/main.html"></iframe>
        </body>
        </html>
    `);
    blank.document.close();
} else {
    document.body.innerHTML =
        "<h2>Please allow popups to use this site.</h2>";
}
</script>
</body>
</html>
