<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Filter Test</title>
</head>
<body>
<script>
const test = window.open("about:blank", "_blank");

if (!test) {
    document.body.textContent = "Popup blocked.";
} else {
    test.document.write(`
        <!DOCTYPE html>
        <html>
        <body>
            <h1>About:blank test</h1>
            <iframe
                src="${location.origin}/main.html"
                style="width:100%;height:90vh;border:0">
            </iframe>
        </body>
        </html>
    `);
    test.document.close();
}
</script>
</body>
</html>
