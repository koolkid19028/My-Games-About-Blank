<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
</head>
<body>
<script>
const blank = window.open("about:blank", "_blank");
if (blank) {
    blank.document.open();
    blank.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
            <title>My Website</title>
            <style>
                html, body {
                    margin: 0;
                    padding: 0;
                    width: 100%;
                    height: 100%;
                    overflow: hidden;
                }
                iframe {
                    width: 100%;
                    height: 100%;
                    border: none;
                }
            </style>
        </head>
        <body>
            <iframe src="${location.href.replace(/index\\.html.*$/, '')}main.html"></iframe>
        </body>
        </html>
    `);
    blank.document.close();
    // Close the original index.html tab
    window.close();
}
</script>
</body>
</html>
