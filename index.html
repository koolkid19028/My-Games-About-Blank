```html
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
</head>
<body>
<script>
(async () => {
    // Find the directory containing this index.html
    const folder = new URL("./", window.location.href);

    // main.html in the same directory
    const mainURL = new URL("main.html", folder);

    // Open an actual about:blank document
    const blank = window.open("about:blank", "_blank");

    if (!blank) {
        document.body.textContent = "Popup blocked.";
        return;
    }

    try {
        const response = await fetch(mainURL.href);

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        let html = await response.text();

        // Keep relative resources working from the subsite's directory.
        const base = folder.href;

        if (/<head[\s>]/i.test(html)) {
            html = html.replace(
                /<head([^>]*)>/i,
                `<head$1><base href="${base}">`
            );
        } else {
            html = `<base href="${base}">` + html;
        }

        // Write main.html directly into the about:blank document.
        // No iframe and no navigation to main.html.
        blank.document.open();
        blank.document.write(html);
        blank.document.close();

    } catch (error) {
        blank.document.open();
        blank.document.write(`
            <!DOCTYPE html>
            <html>
            <body>
                <h2>Unable to load main.html</h2>
                <p>${error.message}</p>
            </body>
            </html>
        `);
        blank.document.close();
    }
})();
</script>
</body>
</html>
```
