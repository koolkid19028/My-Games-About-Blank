<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test Launcher</title>
</head>
<body>
<script>
    const target = new URL("main.html", window.location.href).href;
    const tab = window.open("about:blank", "_blank");
    if (tab) {
        tab.location.href = target;
    } else {
        document.body.innerHTML = `
            <h2>Popup blocked</h2>
            <p>Allow popups for this test site and try again.</p>
        `;
    }
</script>
</body>
</html>
