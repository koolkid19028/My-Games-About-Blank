<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
</head>
<body>
<script>
    const win = window.open("about:blank", "_blank");
    if (win) {
        fetch("main.html")
            .then(response => response.text())
            .then(html => {
                win.document.open();
                win.document.write(html);
                win.document.close();
            })
            .catch(() => {
                win.document.body.innerHTML = "Failed to load main.html";
            });
        window.close();
    } else {
        alert("Please allow popups for this site.");
    }
</script>
</body>
</html>
