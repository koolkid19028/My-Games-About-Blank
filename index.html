<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
    <script>
        window.onload = function () {
            const newTab = window.open("about:blank", "_blank");
            if (newTab) {
                setTimeout(() => {
                    newTab.location.href = "main.html";
                    window.close();
                }, 100);
            } else {
                // If popups are blocked
                window.location.href = "main.html";
            }
        };
    </script>
</head>
<body>
    Loading...
</body>
</html>
